# PR checks: formatting and validation only. No Azure access, nothing deployed.

trigger: none          # don't run on every push to main

pr:                    # do run when a pull request targets main
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest   # a fresh Microsoft-hosted Linux agent each run

steps:
  - script: |
      curl -sSLo terraform.zip https://releases.hashicorp.com/terraform/1.12.2/terraform_1.12.2_linux_amd64.zip
      sudo unzip -o terraform.zip -d /usr/local/bin
    displayName: Install Terraform 1.12.2

  - script: terraform version
    displayName: Show Terraform version on the agent

  - script: terraform fmt -check -recursive
    displayName: Check Terraform formatting

  - script: |
      terraform init -backend=false
      terraform validate
    workingDirectory: environments/avd-personal
    displayName: Validate avd-personal

  - script: |
      terraform init -backend=false
      terraform validate
    workingDirectory: environments/avd-remoteapp
    displayName: Validate avd-remoteapp

  - script: |
      terraform init -backend=false
      terraform validate
    workingDirectory: bootstrap
    displayName: Validate bootstrap

  - script: |
      pipx install checkov
      checkov -d . --framework terraform --compact --quiet 
    displayName: Checkov security scan 